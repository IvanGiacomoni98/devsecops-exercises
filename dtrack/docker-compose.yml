name: dependency-track

services:
  apiserver:
    image: ghcr.io/dependencytrack/apiserver@sha256:7411c390182e6e42156ccf2ab033aa9120a1f37b7ce59e8c2da0d77ec23c0a5f # 5.2.0
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
      restart_policy:
        condition: on-failure
    environment:
      DT_DATASOURCE_URL: ${DB_URL}/${DB_NAME}
      DT_DATASOURCE_USERNAME: ${DB_USERNAME}
      DT_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - "dtrack-v5-data:/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -Y off -T 3 -O /dev/null http://127.0.0.1:9000/health",
        ]
      interval: 30s
      start_period: 60s
      timeout: 5s
    restart: unless-stopped

  frontend:
    image: ghcr.io/dependencytrack/frontend@sha256:7e68cc134284d6206e813212cf2a20c72f438d76f2094c0f05fd5d5e14602dda # 5.2.0
    depends_on:
      apiserver:
        condition: service_healthy
    environment:
      API_BASE_URL: "${API_ENDPOINT}"
    ports:
      - "8080:8080"
    restart: unless-stopped

  postgres:
    image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # 18.6-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - "postgres-v5-data:/var/lib/postgresql"
    restart: unless-stopped

volumes:
  dtrack-v5-data: {}
  postgres-v5-data: {}
